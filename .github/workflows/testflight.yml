name: TestFlight

# Manual only. A push should never spend a build number or notify testers as a
# side effect of merging something.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What testers should look at in this build"
        required: false
        default: "Widget dispatch test — see docs/device-test-widget-dispatch.md"

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-latest
    # Uploading is slow and the runner default is short.
    timeout-minutes: 45

    env:
      ARCHIVE_PATH: build/DrinkTracker.xcarchive
      EXPORT_PATH: build/export

    steps:
      - uses: actions/checkout@v5

      - name: Select newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Check required secrets
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          # Fail here with a readable message rather than 20 minutes later inside
          # xcodebuild, where a missing secret surfaces as a signing error that
          # doesn't name the cause.
          missing=""
          [ -z "$KEY_ID" ]      && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$ISSUER_ID" ]   && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$PRIVATE_KEY" ] && missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"
          [ -z "$TEAM_ID" ]     && missing="$missing DEVELOPMENT_TEAM"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "See docs/testflight-setup.md for how to create each one."
            exit 1
          fi

      - name: Install the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # altool looks for the key at this exact path and filename. xcodebuild is
          # told the path explicitly below, but writing it here serves both.
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Set the build number
        run: |
          # Monotonic per run so TestFlight never rejects a duplicate. MARKETING_VERSION
          # stays whatever the project says — this is the build, not the version.
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Archive
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -o pipefail
          # -allowProvisioningUpdates with an authenticated API key lets Xcode create
          # and download the profiles for both the app and the widget extension,
          # including the App Group. That is why no certificate or profile is stored
          # as a secret: the key is the only credential.
          xcodebuild archive \
            -project DrinkTracker.xcodeproj \
            -scheme DrinkTracker \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -allowProvisioningUpdates \
            -skipPackagePluginValidation \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Write export options
        env:
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          # Generated rather than committed so the team ID stays in secrets and out
          # of the repository.
          mkdir -p build
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST

      - name: Export the ipa
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -allowProvisioningUpdates

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ipa=$(find "$EXPORT_PATH" -name "*.ipa" | head -1)
          if [ -z "$ipa" ]; then
            echo "No .ipa produced. Contents of $EXPORT_PATH:"
            ls -la "$EXPORT_PATH" || true
            exit 1
          fi
          echo "Uploading $ipa"
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Keep the archive on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-and-logs
          path: |
            build/
            ~/Library/Logs/gym
          retention-days: 5

      - name: What to do next
        run: |
          echo "Uploaded build $BUILD_NUMBER."
          echo "Processing in App Store Connect takes a few minutes before it appears in TestFlight."
          echo "Tester notes: ${{ inputs.notes }}"
          echo "Test protocol: docs/device-test-widget-dispatch.md"
