name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheapest gate in the file, and Linux rather than macOS on purpose: it reads
  # two files and compares a date. The privacy policy's copies drifting apart is
  # a documentation bug that looks like nothing on screen, so it is worth
  # catching before review rather than after a release.
  policy-copies:
    name: Policy copies
    runs-on: ubuntu-latest
    steps:
      # `token:` rather than the default GITHUB_TOKEN because `contract/` is a
      # submodule of the private semmes/tallyist-product, and GITHUB_TOKEN is
      # scoped to this repository alone — it cannot read another private repo, so
      # every checkout below would fail on the submodule fetch. checkout uses this
      # token for the superproject and for submodules, so the PAT needs Contents:
      # read on BOTH semmes/DrinkTracker and semmes/tallyist-product. It is
      # read-only and its expiry is watched daily by mirror-docs.yml's
      # `token-expiry` job, the same as the mirror token.
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.TALLYIST_CONTRACT_TOKEN }}
      - name: Dates agree across the policy's copies
        run: python3 .github/scripts/check_policy_dates.py

  # The drink and tab glyphs are generated output (ADR-0036, ADR-0040): thirteen
  # .symbolset folders written by a dependency-free script from the owner's
  # SVGs into the shared catalog every target compiles. A hand-edited
  # symbolset, a renamed case in DrinkType.Symbol or AppTab.symbolName, or a
  # stale catalog would all compile green and render nothing, so this
  # regenerates and requires a clean tree. Linux on purpose, like the policy
  # check: it needs only Python.
  drink-symbols:
    name: Drink glyphs match their source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.TALLYIST_CONTRACT_TOKEN }}
      - name: Regenerate the symbolsets and compare
        run: |
          python3 scripts/make-drink-symbols.py
          git diff --exit-code -- Shared/Assets.xcassets
          test -z "$(git status --porcelain -- Shared/Assets.xcassets)"

  # The watch's wiring, read from the project file and the targets' own files:
  # memberships of every Shared/ file, the embed phases, the settings that change
  # what shared code means, and which targets may mirror the store. That last is
  # the rule ADR-0055 rests on: one process per device mirrors, the app, so an
  # extension that gains the iCloud container back in Xcode's Capabilities pane
  # fails here instead of silently mirroring beside its app. --ci skips the
  # checks about this Mac's checkouts, which mean nothing on a runner. Linux on
  # purpose, like the two jobs above: it needs only Python.
  watch-wiring:
    name: Watch and extension wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.TALLYIST_CONTRACT_TOKEN }}
      - name: Verify the targets' wiring
        run: python3 scripts/verify-watch-setup.py --ci

  # Tier 1 (docs/PRD.md §4). Pure value types, no simulator and no signing —
  # DrinkTrackerCore declares .macOS(.v15) precisely so this can run natively.
  domain-tests:
    name: Domain tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.TALLYIST_CONTRACT_TOKEN }}

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: swift test
        working-directory: DrinkTrackerCore
        run: swift test

  # Builds the app scheme, which builds and embeds the widget extension, the
  # watch app and its complication as target dependencies — one scheme covers
  # all four targets, so a watch target that does not compile turns this job
  # red as well as `build-watch` below.
  #
  # CODE_SIGNING_ALLOWED=NO because the simulator needs no signing and CI has no
  # team; see README "Signing and provisioning".
  build:
    name: Build (iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.TALLYIST_CONTRACT_TOKEN }}

      - name: Select newest installed Xcode
        run: |
          # The project deploys to iOS 26.0, so this needs Xcode 26 or newer. If
          # the runner image is older the build fails here with a clear SDK error
          # rather than something obscure further down.
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "ios" || true

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DrinkTracker.xcodeproj \
            -scheme DrinkTracker

      - name: Build
        run: |
          # generic/platform rather than a named device: runner images rotate
          # their installed simulators, and a build job doesn't need a bootable
          # one. Anything requiring a real device is Tier 4 and can't run here.
          set -o pipefail
          xcodebuild build \
            -project DrinkTracker.xcodeproj \
            -scheme DrinkTracker \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  # The watch scheme on its own, for the watchOS simulator. The job above
  # already compiles the watch targets as dependencies of the app; this one is
  # the compile gate a watch phase names in its commit message, and the only
  # compile check a remote session gets for the wrist (watch Phase 1,
  # docs/tallyist-watch-plan.md).
  build-watch:
    name: Build (watchOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.TALLYIST_CONTRACT_TOKEN }}

      - name: Select newest installed Xcode
        run: |
          # watchOS 26 needs Xcode 26 or newer. Failing here gives a clear SDK
          # error rather than something obscure further down.
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "watch" || true

      - name: Build
        run: |
          # generic/platform, not a named device: runner images rotate their
          # installed simulators and a build job needs no bootable one.
          set -o pipefail
          xcodebuild build \
            -project DrinkTracker.xcodeproj \
            -scheme DrinkTrackerWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  # Tier 2 (docs/PRD.md §4). SwiftData's @Model macro only expands inside Xcode,
  # so anything about rows has to run here rather than in the SPM package.
  #
  # This one needs a bootable simulator, unlike the build job — an xctest bundle
  # has to actually launch somewhere.
  integration-tests:
    name: Integration tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.TALLYIST_CONTRACT_TOKEN }}

      - name: Select newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Pick an available simulator
        id: sim
        run: |
          # Resolved at run time rather than pinned to a device name: runner
          # images rotate which simulators ship, and pinning "iPhone 17 Pro"
          # turns an image update into a red build for no reason.
          udid=$(xcrun simctl list devices available \
            | grep -E "^\s+iPhone" \
            | head -1 \
            | grep -oE "[0-9A-F]{8}-[0-9A-F-]{27}")
          if [ -z "$udid" ]; then
            echo "No iPhone simulator available on this runner image:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project DrinkTracker.xcodeproj \
            -scheme DrinkTracker \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:DrinkTrackerTests \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
